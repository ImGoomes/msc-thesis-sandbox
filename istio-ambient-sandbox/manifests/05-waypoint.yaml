# Namespace waypoint: one shared Envoy that applies L7 policy (paths, methods)
# and traffic rules (canary split, retries, faults). Same as
# `istioctl waypoint generate -n mesh-demo`.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: mesh-demo
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
