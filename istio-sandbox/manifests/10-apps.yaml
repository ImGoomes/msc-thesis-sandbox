# --- frontend ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: mesh-demo
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mesh-demo
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v1
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: mesh-demo/frontend:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ORDERS_URL
              value: "http://orders:8000/orders"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
# --- orders ---
apiVersion: v1
